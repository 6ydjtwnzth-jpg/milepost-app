  <p>फ़्लैशकार्ड में सिर्फ़ उन पाठों के शब्द हैं जो आपने कर लिए हैं (नीचे सीमा बदल सकते हैं)। सही जवाब पर शब्द देर से लौटता है, ग़लत पर जल्दी। लक्ष्य: सब डिब्बे 5 में।</p>
  <p><b>सुनिए</b>: सिर्फ़ आवाज़ सुनिए और अर्थ बोलिए। <b>बोलिए</b>: हिंदी देखिए और अंग्रेज़ी शब्द बोलिए। <b>पढ़िए</b>: अंग्रेज़ी देखिए और अर्थ बोलिए।</p>
