  <p>单词卡只包含你已经学到的课的单词（可以在下面改范围）。单词分在五个盒子里。答对了，单词升一个盒子，以后出现得少一些；答错了，回到第一个盒子。低号盒子里的单词出现得更频繁。目标：全部进入第 5 个盒子。</p>
  <p><b>听</b>模式：卡片上什么都不显示，只听声音，说出意思。<b>说</b>模式：看中文，大声说出带冠词的意大利语单词。<b>读</b>模式：看意大利语，说出意思。</p>
